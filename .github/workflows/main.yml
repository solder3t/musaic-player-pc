name: Musaic Player CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.x

jobs:
  quality-gate:
    name: Quality Gate (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install Linux native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libasound2-dev

      - name: Install dependencies
        run: npm ci

      - name: Build native modules
        run: npm run rebuild:native

      - name: Verify native module exists
        shell: bash
        run: |
          if [ ! -f native/build/Release/visualizer_dsp.node ]; then
            echo "ERROR: native DSP module was not built!"
            exit 1
          fi
          echo "Native module built successfully: $(ls -lh native/build/Release/visualizer_dsp.node)"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate packaging config
        run: npm run check:packaging-config

      - name: Build project
        run: npm run build

  build-smoke:
    name: Build Distributable (Linux)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install Linux native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libasound2-dev rpm

      - name: Install dependencies
        run: npm ci

      - name: Build native modules
        run: npm run rebuild:native

      - name: Build Linux package
        run: npm run dist:linux
