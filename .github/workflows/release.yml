name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version label for the build (e.g. v0.5.0, alpha-1, beta-2)'
        required: false
        default: ''
      release_notes:
        description: 'Custom Release Notes / Changelog (Optional Markdown)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist_cmd: dist:linux
          - os: macos-latest
            dist_cmd: dist:mac
          # Pin Windows to VS 2022; windows-latest can roll to VS 2026 before
          # Electron's node-gyp stack recognizes the new Visual Studio version.
          - os: windows-2022
            dist_cmd: dist:win

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Cache Electron
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Install Linux native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libasound2-dev rpm

      - name: Build native DSP module
        run: npm run rebuild:native

      - name: Verify native module exists
        shell: bash
        run: |
          if [ ! -f native/build/Release/visualizer_dsp.node ]; then
            echo "ERROR: native DSP module was not built!"
            exit 1
          fi
          echo "Native module built successfully: $(ls -lh native/build/Release/visualizer_dsp.node)"

      - name: Write Last.fm credentials file
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
        run: |
          node -e 'const fs=require("fs"); const key=process.env.LASTFM_API_KEY ?? ""; const secret=process.env.LASTFM_SHARED_SECRET ?? ""; fs.writeFileSync(".env.local", `LASTFM_API_KEY=${key}\nLASTFM_SHARED_SECRET=${secret}\n`, "utf8")'

      - name: Build distributable
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
        run: npm run ${{ matrix.dist_cmd }}

      - name: Verify release artifact names
        run: node scripts/release/verify-release-artifacts.cjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: musaic-${{ runner.os }}${{ inputs.version_tag && format('-{0}', inputs.version_tag) || '' }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine release tag and name
        id: release_info
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ -n "${{ inputs.version_tag }}" ]; then
            TAG="${{ inputs.version_tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$PKG_VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=Musaic Player $TAG" >> $GITHUB_OUTPUT
          VERSION_NAME=${TAG#v}
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Publishing release for tag: $TAG"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Display downloaded artifacts
        run: ls -lh dist-release

      - name: Generate changelog
        id: changelog
        run: |
          VERSION_NAME="${{ steps.release_info.outputs.version }}"
          
          # 1. Check if user provided manual release notes via workflow dispatch input
          MANUAL_NOTES="${{ inputs.release_notes }}"
          if [ -n "$MANUAL_NOTES" ]; then
            echo "Using release notes provided via workflow input."
            {
              echo "body<<EOF"
              echo "$MANUAL_NOTES"
              echo "EOF"
            } >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2. Check if CHANGELOG.md has an entry for this version
          if [ -f "CHANGELOG.md" ]; then
            EXTRACTED=$(sed -n "/## \[$VERSION_NAME\]/,/## \[/p" CHANGELOG.md | sed '$d' | sed '1d' | sed '/^[[:space:]]*$/d')
            if [ -z "$EXTRACTED" ]; then
              EXTRACTED=$(sed -n "/## v$VERSION_NAME/,/## v/p" CHANGELOG.md | sed '$d' | sed '1d' | sed '/^[[:space:]]*$/d')
            fi
            if [ -z "$EXTRACTED" ]; then
              EXTRACTED=$(sed -n "/## $VERSION_NAME/,/## /p" CHANGELOG.md | sed '$d' | sed '1d' | sed '/^[[:space:]]*$/d')
            fi
            if [ -n "$EXTRACTED" ]; then
              echo "Extracted changelog from CHANGELOG.md for v$VERSION_NAME."
              {
                echo "body<<EOF"
                echo "$EXTRACTED"
                echo "EOF"
              } >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # 3. Fallback: Automatically extract clean commit history since previous release tag
          echo "Extracting changelog from git commits..."
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG..HEAD" --pretty=format:"• %s" --no-merges | grep -v "Merge branch" | grep -v "chore(release)" || true)
          else
            COMMITS=$(git log -n 15 --pretty=format:"• %s" --no-merges | grep -v "Merge branch" | grep -v "chore(release)" || true)
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="• General stability improvements and bug fixes."
          fi

          {
            echo "body<<EOF"
            echo "### What's New in v${VERSION_NAME}"
            echo ""
            echo "$COMMITS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
          files: |
            dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
